server {
    listen 80;
    server_name launcher.despical.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name launcher.despical.dev;

    ssl_certificate /etc/nginx/ssl/hub-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/hub-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1g;

    # Generated from Cloudflare's published IPv4 and IPv6 lists on the VPS.
    include /etc/nginx/conf.d/launcher-cloudflare-realip.inc;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $launcher_upstream greenlauncher-website:8087;

    location / {
        proxy_pass http://$launcher_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host launcher.despical.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host launcher.despical.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Forwarded "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }
}
