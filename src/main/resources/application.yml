server:
  port: ${PORT:8087}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: green-launcher-web
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/site;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  thymeleaf:
    cache: true
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-url: ${SITE_PUBLIC_URL:http://localhost:8087}
  storage: ${SITE_STORAGE:./data}
  admin-username: ${SITE_ADMIN_USERNAME:admin}
  admin-password-hash: ${SITE_ADMIN_PASSWORD_HASH:}
  local-admin: false
  seed-releases: true
