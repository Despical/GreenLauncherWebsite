faq.title=Aklında bir şey mi var?
faq.free=Green Launcher ücretsiz mi?
faq.free.answer=Evet. Green Launcher ücretsiz ve GPL-3.0 lisansıyla açık kaynak. Kaynak kodunu GitHub'da inceleyebilirsin. Minecraft oyunu ayrı satın alınır.
faq.package=Setup mı, portable mı?
faq.package.answer=Çoğu kullanıcı için setup önerilir: Başlat menüsü entegrasyonu ve kurulu uygulama güncellemeleri sağlar. Portable sürüm kurulum sihirbazı olmadan çalışır; launcher verileri uygulama veri klasöründe saklanır.
faq.system=Hangi sistemlerde çalışır?
faq.system.answer=Mevcut dağıtımlar 64-bit Windows 10 ve Windows 11 içindir. Minecraft sürümünün gerektirdiği Java, launcher üzerinden indirilebilir. İlk kurulum ve içerik indirmeleri için internet gerekir.
faq.update=Güncellemeler nasıl yüklenir?
faq.update.answer=Launcher yeni sürümü bildirdiğinde güncellemeyi sen başlatırsın. Oyun, indirme veya kurulum açıkken güncelleme engellenir. Hesapların, profillerin ve dünyaların ayrı tutulur.
