faq.all=Tüm soruları ve cevapları gör
faq.intro=Kurulum, hesaplar, modlar ve dünyalar. Green Launcher hakkında merak ettiklerini burada bulabilirsin.
faq.memory=Oyuna ayrılan belleği nasıl değiştiririm?
faq.memory.answer=Profil ayarlarından minimum ve maksimum bellek değerlerini ayrı ayrı düzenleyebilirsin. Mod paketinin gereksinimlerini ve bilgisayarının toplam belleğini dikkate al; işletim sistemi için de boş bellek bırak.
faq.loaders=Hangi mod yükleyicilerini kullanabilirim?
faq.loaders.answer=Fabric, Forge ve NeoForge gibi yükleyicileri profil oluştururken seçebilirsin. Kullanılabilir seçenekler Minecraft sürümüne bağlıdır. Modlarını profilinin sürümüne ve yükleyicisine uygun seç.
faq.modpacks=Mod paketleri mevcut profilime karışır mı?
faq.modpacks.answer=Ayrı bir profil kullanarak mod paketini diğer oyunlarından bağımsız tutabilirsin. Paket için gereken Minecraft sürümünü ve mod yükleyicisini kullan; farklı paketlerin dosyalarını aynı oyun klasöründe birleştirme.
faq.shaders=Shader ve kaynak paketi kullanabilir miyim?
faq.shaders.answer=Uyumlu içerikleri profilinin kütüphanesinden yönetebilirsin. Shader kullanmak için oyun sürümüne uygun Iris veya OptiFine gibi bir çözüm gerekir. Kaynak paketleri ve shader’lar oyun içindeki ilgili ayarlardan etkinleştirilir.
faq.import=Profilimi başka bir kurulumda kullanabilir miyim?
faq.import.answer=Profilini dışa aktarıp diğer kurulumda içe aktarabilirsin. Dışa aktarma seçeneklerini ve pakete dahil edilen dosyaları kontrol et. Hesap girişini yeni kurulumda ayrıca yap; dünyaların için de ayrı bir yedek tut.
faq.logs=Oyun açılmazsa ilk olarak neye bakmalıyım?
faq.logs.answer=Önce profilin Java sürümünü, ayrılan belleği ve modların sürüm uyumunu kontrol et. Launcher’ın hata günlüğündeki mesajı incele. Yardım isterken hata mesajını ve tekrar oluşturma adımlarını paylaş; hesap bilgilerini paylaşma.
