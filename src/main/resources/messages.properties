faq.account=Microsoft hesabı gerekiyor mu?
faq.account.answer=Microsoft hesabını launcher’a ekleyebilirsin; bu hesapla oynamak için Minecraft Java Edition sahibi olmalısın. Yerel çevrimdışı hesaplar da desteklenir, ancak yalnızca bu hesaplara izin veren sunuculara katılabilir. Launcher, Minecraft lisansı vermez.
faq.java=Java’yı ayrıca kurmam gerekiyor mu?
faq.java.answer=Launcher, Minecraft sürümünün ihtiyaç duyduğu Java’yı indirip kurabilir. Var olan bir Java kurulumunu da profil ayarlarından seçebilirsin. Farklı Minecraft sürümleri farklı Java sürümleri gerektirebilir; Java kurulumlarını launcher’dan yönetebilirsin.
faq.mods=Mod ve mod paketi yükleyebilir miyim?
faq.mods.answer=Evet. Modrinth kataloğunu launcher içinde gezebilir, modları veya mod paketlerini profillerine yükleyebilirsin. İçeriğin Minecraft sürümü ve mod yükleyicisi profilinle uyumlu olmalı. Fabric, Forge ve NeoForge gibi yükleyicileri profil oluştururken seçebilirsin.
faq.profiles=Birden fazla sürümü ayrı kullanabilir miyim?
faq.profiles.answer=Evet. Her profil kendi Minecraft sürümünü, oyun klasörünü, modlarını, Java ve bellek ayarlarını kullanır. Böylece vanilla oyununla farklı mod paketlerin birbirine karışmaz. Profilleri içe ve dışa aktararak kurulumlarını tekrar kullanabilirsin.
faq.worlds=Mevcut dünyalarımı kullanabilir miyim?
faq.worlds.answer=Dünyalarını ilgili profilin Dünyalar sayfasından içe aktarabilirsin. Oyun sürümünü dünyanla uyumlu seç; özellikle yeni sürümde açılmış bir dünyayı eski sürümde açmadan önce kayıtlarının yedeğini al. Launcher’dan dünyaları kopyalayabilir ve kayıt klasörünü açabilirsin.
faq.help=Bir sorun yaşarsam nereden yardım alırım?
faq.help.answer=Discord topluluğuna katılabilir veya GitHub’da bir sorun kaydı açabilirsin. Launcher sürümünü, kullandığın Minecraft sürümünü ve sorunu tekrar oluşturma adımlarını ekle. Gerekli hata günlüğünü paylaşmadan önce kişisel bilgileri ve hesap bilgilerini kaldır.
