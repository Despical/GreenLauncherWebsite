faq.all=Alle Fragen und Antworten
faq.intro=Einrichtung, Konten, Mods und Welten. Hier findest du Antworten rund um Green Launcher.
faq.memory=Wie ändere ich den Arbeitsspeicher für das Spiel?
faq.memory.answer=Ändere minimalen und maximalen Speicher getrennt in den Profileinstellungen. Beachte die Anforderungen des Modpacks und den verfügbaren RAM. Lass Speicher für das Betriebssystem frei.
faq.loaders=Welche Mod-Loader kann ich nutzen?
faq.loaders.answer=Wähle Fabric, Forge oder NeoForge beim Erstellen eines Profils. Verfügbare Optionen hängen von der Minecraft-Version ab. Mods müssen zu Version und Loader passen.
faq.modpacks=Vermischen sich Modpacks mit meinem Profil?
faq.modpacks.answer=Mit einem eigenen Profil bleibt ein Modpack von anderen Installationen getrennt. Nutze die erforderliche Minecraft-Version und den Loader; mische verschiedene Pakete nicht im selben Spielordner.
faq.shaders=Kann ich Shader und Ressourcenpakete nutzen?
faq.shaders.answer=Verwalte kompatible Inhalte in der Profilbibliothek. Shader benötigen etwa Iris oder OptiFine für deine Spielversion. Aktiviere Ressourcenpakete und Shader in den jeweiligen Spieleinstellungen.
faq.import=Kann ich mein Profil in einer anderen Installation nutzen?
faq.import.answer=Exportiere dein Profil und importiere es in die andere Installation. Prüfe Exportoptionen und enthaltene Dateien. Melde dich dort separat an und sichere deine Welten zusätzlich.
faq.logs=Was prüfe ich, wenn das Spiel nicht startet?
faq.logs.answer=Prüfe zuerst Java-Version, Speicher und Mod-Kompatibilität des Profils. Lies das Fehlerprotokoll im Launcher. Teile bei Hilfeanfragen die Fehlermeldung und Schritte zur Reproduktion, keine Kontodaten.
