faq.title=Noch Fragen?
faq.free=Ist Green Launcher kostenlos?
faq.free.answer=Ja. Green Launcher ist kostenlos und unter GPL-3.0 quelloffen. Der Code ist auf GitHub. Minecraft wird separat gekauft.
faq.package=Installer oder portable?
faq.package.answer=Für die meisten Nutzer ist der Installer mit Startmenü-Integration empfohlen. Portable läuft ohne Setup-Assistenten; Launcher-Daten liegen weiterhin im Anwendungsdatenordner.
faq.system=Welche Systeme werden unterstützt?
faq.system.answer=Aktuelle Versionen unterstützen Windows 10 und 11 mit 64 Bit. Passendes Java kann im Launcher geladen werden. Ersteinrichtung und Downloads benötigen Internet.
faq.update=Wie funktionieren Updates?
faq.update.answer=Du startest das Update bei einer neuen Version selbst. Während Spiele, Downloads oder Installationen laufen, sind Updates gesperrt. Konten, Profile und Welten bleiben getrennt gespeichert.
