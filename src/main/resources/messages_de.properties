faq.account=Brauche ich ein Microsoft-Konto?
faq.account.answer=Du kannst ein Microsoft-Konto hinzufügen; dafür musst du Minecraft Java Edition besitzen. Lokale Offline-Konten werden ebenfalls unterstützt, können aber nur dafür freigegebene Server betreten. Der Launcher stellt keine Minecraft-Lizenz bereit.
faq.java=Muss ich Java separat installieren?
faq.java.answer=Der Launcher kann passendes Java herunterladen und installieren. Bestehende Installationen kannst du in den Profileinstellungen wählen. Verschiedene Minecraft-Versionen benötigen möglicherweise unterschiedliches Java; verwalte es im Launcher.
faq.mods=Kann ich Mods und Modpacks installieren?
faq.mods.answer=Ja. Durchsuche Modrinth und installiere Mods oder Modpacks in deinen Profilen. Inhalte müssen zur Minecraft-Version und zum Loader passen. Fabric, Forge und NeoForge lassen sich beim Erstellen eines Profils wählen.
faq.profiles=Kann ich mehrere Versionen getrennt nutzen?
faq.profiles.answer=Ja. Jedes Profil hat eigene Minecraft-Versionen, Spielordner, Mods, Java- und Speichereinstellungen. So bleiben Vanilla und Modpacks getrennt. Importiere und exportiere Profile zur Wiederverwendung.
faq.worlds=Kann ich vorhandene Welten nutzen?
faq.worlds.answer=Importiere Welten auf der Weltseite des jeweiligen Profils. Wähle eine passende Spielversion und sichere Spielstände vor dem Öffnen in älteren Versionen. Welten lassen sich kopieren und Speicherordner öffnen.
faq.help=Wo bekomme ich Hilfe?
faq.help.answer=Besuche Discord oder erstelle ein GitHub-Issue. Gib Launcher- und Minecraft-Version sowie Schritte zum Nachstellen an. Entferne persönliche und Kontodaten, bevor du relevante Protokolle teilst.
