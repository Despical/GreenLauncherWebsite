faq.title=Something on your mind?
faq.free=Is Green Launcher free?
faq.free.answer=Yes. Green Launcher is free and open source under GPL-3.0. Explore the code on GitHub. Minecraft is purchased separately.
faq.package=Setup or portable?
faq.package.answer=Setup is recommended for most users, with Start menu integration and installed-app updates. Portable runs without a setup wizard; launcher data is still stored in the application data folder.
faq.system=Which systems are supported?
faq.system.answer=Current builds target 64-bit Windows 10 and Windows 11. Java for your Minecraft version can be downloaded through the launcher. Initial setup and content downloads need internet.
faq.update=How do updates work?
faq.update.answer=You start the update when the launcher reports a new release. Updates are blocked while games, downloads, or installations are active. Accounts, profiles, and worlds are stored separately.
