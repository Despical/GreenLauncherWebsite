faq.account=Do I need a Microsoft account?
faq.account.answer=You can add a Microsoft account; playing with it requires ownership of Minecraft Java Edition. Local offline accounts are also supported, but can only join servers that allow them. The launcher does not provide a Minecraft license.
faq.java=Do I need to install Java separately?
faq.java.answer=The launcher can download and install Java for your Minecraft version. You can also select an existing installation in profile settings. Different Minecraft versions may require different Java versions; manage those installations in the launcher.
faq.mods=Can I install mods and modpacks?
faq.mods.answer=Yes. Browse Modrinth inside the launcher and install mods or modpacks in your profiles. Content must match your profile’s Minecraft version and mod loader. Select loaders such as Fabric, Forge, and NeoForge when creating a profile.
faq.profiles=Can I keep multiple versions separate?
faq.profiles.answer=Yes. Each profile has its own Minecraft version, game folder, mods, Java, and memory settings. Keep vanilla and different modpacks separate. Import and export profiles to reuse your setups.
faq.worlds=Can I use my existing worlds?
faq.worlds.answer=Import worlds from the Worlds page of the relevant profile. Choose a compatible game version and back up saves before opening a world in an older version. You can duplicate worlds and open save folders from the launcher.
faq.help=Where can I get help?
faq.help.answer=Join the Discord community or open an issue on GitHub. Include the launcher version, Minecraft version, and steps to reproduce the problem. Remove personal and account information before sharing relevant logs.
