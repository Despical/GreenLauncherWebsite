faq.intro=Setup, accounts, mods, and worlds. Find answers to your questions about Green Launcher here.
faq.memory=How do I change the game’s memory allocation?
faq.memory.answer=Edit minimum and maximum memory separately in profile settings. Consider your modpack’s requirements and your computer’s total memory, and leave some available for the operating system.
faq.loaders=Which mod loaders can I use?
faq.loaders.answer=Choose loaders such as Fabric, Forge, and NeoForge when creating a profile. Available options depend on the Minecraft version. Match your mods to the profile’s version and loader.
faq.modpacks=Will modpacks mix with my existing profile?
faq.modpacks.answer=Use a separate profile to keep a modpack independent of your other games. Use the Minecraft version and loader required by the pack, and keep different packs out of the same game folder.
faq.shaders=Can I use shaders and resource packs?
faq.shaders.answer=Manage compatible content in your profile’s library. Shaders need a solution such as Iris or OptiFine for your game version. Enable resource packs and shaders in their respective in-game settings.
faq.import=Can I move my profile to another installation?
faq.import.answer=Export your profile and import it into the other installation. Check the export options and included files. Sign in separately on the new installation and keep a separate backup of your worlds.
faq.logs=What should I check if the game won’t start?
faq.logs.answer=Check the profile’s Java version, allocated memory, and mod compatibility first. Review the launcher’s error log. When asking for help, include the error and steps to reproduce it, without account information.
