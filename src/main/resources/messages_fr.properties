faq.account=Faut-il un compte Microsoft ?
faq.account.answer=Tu peux ajouter un compte Microsoft ; il faut posséder Minecraft Java Edition pour jouer avec. Les comptes locaux hors ligne sont aussi pris en charge, uniquement sur les serveurs qui les autorisent. Le launcher ne fournit pas de licence Minecraft.
faq.java=Dois-je installer Java séparément ?
faq.java.answer=Le launcher peut télécharger et installer le Java adapté. Tu peux aussi choisir une installation existante dans ton profil. Les versions de Minecraft peuvent nécessiter différents Java ; gère-les dans le launcher.
faq.mods=Puis-je installer des mods et modpacks ?
faq.mods.answer=Oui. Explore Modrinth et installe mods ou modpacks dans tes profils. Le contenu doit correspondre à la version de Minecraft et au chargeur du profil. Choisis Fabric, Forge ou NeoForge à sa création.
faq.profiles=Puis-je séparer plusieurs versions ?
faq.profiles.answer=Oui. Chaque profil a sa version, son dossier, ses mods et ses réglages Java et mémoire. Vanilla et modpacks restent séparés. Importe et exporte tes profils pour réutiliser tes configurations.
faq.worlds=Puis-je utiliser mes mondes existants ?
faq.worlds.answer=Importe tes mondes depuis la page Mondes du profil. Choisis une version compatible et sauvegarde avant d’ouvrir un monde dans une version plus ancienne. Tu peux dupliquer les mondes et ouvrir leurs dossiers.
faq.help=Où trouver de l’aide ?
faq.help.answer=Rejoins Discord ou ouvre un ticket sur GitHub. Indique les versions du launcher et de Minecraft ainsi que les étapes du problème. Retire les informations personnelles et de compte avant de partager les journaux.
