faq.title=Une question ?
faq.free=Green Launcher est-il gratuit ?
faq.free.answer=Oui. Green Launcher est gratuit et open source sous GPL-3.0. Le code est sur GitHub. Minecraft s’achète séparément.
faq.package=Installeur ou portable ?
faq.package.answer=L’installeur est recommandé avec son intégration au menu Démarrer. La version portable n’a pas d’assistant d’installation ; les données restent dans le dossier de données d’application.
faq.system=Quels systèmes sont compatibles ?
faq.system.answer=Les versions actuelles sont pour Windows 10 et 11 en 64 bits. Le Java nécessaire peut être téléchargé via le launcher. Une connexion est requise pour l’installation initiale et les téléchargements.
faq.update=Comment installer les mises à jour ?
faq.update.answer=Tu démarres la mise à jour quand une nouvelle version est signalée. Elle est bloquée pendant les jeux, téléchargements ou installations. Comptes, profils et mondes sont conservés séparément.
