faq.all=Voir toutes les questions
faq.intro=Installation, comptes, mods et mondes. Retrouve ici les réponses sur Green Launcher.
faq.memory=Comment modifier la mémoire du jeu ?
faq.memory.answer=Modifie séparément la mémoire minimale et maximale dans les réglages du profil. Tiens compte du modpack et de la mémoire totale du PC, en gardant de la place pour le système.
faq.loaders=Quels loaders de mods puis-je utiliser ?
faq.loaders.answer=Choisis Fabric, Forge ou NeoForge en créant un profil. Les options dépendent de la version de Minecraft. Utilise des mods compatibles avec la version et le loader du profil.
faq.modpacks=Les modpacks se mélangent-ils à mon profil ?
faq.modpacks.answer=Un profil séparé garde le modpack indépendant des autres installations. Utilise sa version de Minecraft et son loader, sans mélanger plusieurs packs dans un même dossier de jeu.
faq.shaders=Puis-je utiliser des shaders et des packs de ressources ?
faq.shaders.answer=Gère les contenus compatibles dans la bibliothèque du profil. Les shaders nécessitent Iris ou OptiFine adapté à ta version. Active packs de ressources et shaders dans les réglages du jeu.
faq.import=Puis-je transférer mon profil vers une autre installation ?
faq.import.answer=Exporte ton profil puis importe-le dans l’autre installation. Vérifie les options et fichiers inclus. Connecte ton compte séparément et conserve une sauvegarde de tes mondes.
faq.logs=Que vérifier si le jeu ne démarre pas ?
faq.logs.answer=Vérifie d’abord Java, la mémoire et la compatibilité des mods du profil. Consulte le journal d’erreurs du launcher. Pour demander de l’aide, partage l’erreur et les étapes, sans informations de compte.
