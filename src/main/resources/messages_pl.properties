faq.title=Masz pytanie?
faq.free=Czy Green Launcher jest bezpłatny?
faq.free.answer=Tak. Green Launcher jest bezpłatny i open source na licencji GPL-3.0. Kod jest na GitHub. Minecraft kupuje się osobno.
faq.package=Instalator czy portable?
faq.package.answer=Dla większości zalecany jest instalator z integracją menu Start. Portable działa bez kreatora instalacji; dane pozostają w folderze danych aplikacji.
faq.system=Jakie systemy są obsługiwane?
faq.system.answer=Obecne wersje obsługują 64-bitowe Windows 10 i 11. Wymaganą Javę pobierzesz w launcherze. Pierwsza konfiguracja i pobieranie wymagają internetu.
faq.update=Jak instalować aktualizacje?
faq.update.answer=Sam rozpoczynasz aktualizację po powiadomieniu o nowej wersji. Podczas gry, pobierania lub instalacji aktualizacje są zablokowane. Konta, profile i światy są przechowywane osobno.
