faq.all=Wszystkie pytania i odpowiedzi
faq.intro=Instalacja, konta, mody i światy. Tutaj znajdziesz odpowiedzi dotyczące Green Launchera.
faq.memory=Jak zmienić ilość pamięci dla gry?
faq.memory.answer=Zmień osobno minimalną i maksymalną pamięć w ustawieniach profilu. Uwzględnij wymagania modpacka i pamięć komputera; zostaw też wolną pamięć dla systemu.
faq.loaders=Jakich loaderów modów mogę używać?
faq.loaders.answer=Wybierz Fabric, Forge lub NeoForge podczas tworzenia profilu. Dostępność zależy od wersji Minecrafta. Mody muszą pasować do wersji gry i loadera profilu.
faq.modpacks=Czy modpacki zmieszają się z moim profilem?
faq.modpacks.answer=Osobny profil pozwala oddzielić modpack od innych instalacji. Używaj wymaganej wersji Minecrafta i loadera; nie łącz różnych paczek w jednym folderze gry.
faq.shaders=Czy mogę używać shaderów i paczek zasobów?
faq.shaders.answer=Zarządzaj zgodną zawartością w bibliotece profilu. Shadery wymagają Iris lub OptiFine pasującego do wersji gry. Włącz paczki zasobów i shadery w odpowiednich ustawieniach gry.
faq.import=Czy mogę przenieść profil do innej instalacji?
faq.import.answer=Wyeksportuj profil i zaimportuj go w innej instalacji. Sprawdź opcje eksportu i dołączone pliki. Zaloguj konto osobno i zachowaj oddzielną kopię światów.
faq.logs=Co sprawdzić, jeśli gra się nie uruchamia?
faq.logs.answer=Najpierw sprawdź Javę, przydzieloną pamięć i zgodność modów w profilu. Zobacz dziennik błędów launchera. Prosząc o pomoc, podaj błąd i kroki odtworzenia, bez danych konta.
