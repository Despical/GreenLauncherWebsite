faq.account=Czy potrzebuję konta Microsoft?
faq.account.answer=Możesz dodać konto Microsoft; do gry na nim potrzebujesz Minecraft Java Edition. Obsługiwane są też lokalne konta offline, które mogą dołączać tylko do serwerów zezwalających na takie konta. Launcher nie zapewnia licencji Minecrafta.
faq.java=Czy muszę osobno instalować Javę?
faq.java.answer=Launcher może pobrać i zainstalować Javę dla twojej wersji Minecrafta. W ustawieniach profilu możesz wybrać istniejącą instalację. Różne wersje gry mogą wymagać różnych wersji Javy; zarządzaj nimi w launcherze.
faq.mods=Czy mogę instalować mody i modpacki?
faq.mods.answer=Tak. Przeglądaj Modrinth i instaluj mody lub modpacki w profilach. Zawartość musi pasować do wersji gry i loadera profilu. Fabric, Forge i NeoForge wybierzesz przy tworzeniu profilu.
faq.profiles=Czy mogę oddzielić kilka wersji gry?
faq.profiles.answer=Tak. Każdy profil ma własną wersję gry, folder, mody, Javę i ustawienia pamięci. Vanilla i modpacki pozostają oddzielone. Importuj i eksportuj profile, aby ponownie używać konfiguracji.
faq.worlds=Czy mogę używać istniejących światów?
faq.worlds.answer=Importuj światy ze strony Światy wybranego profilu. Wybierz zgodną wersję i zrób kopię przed otwieraniem świata w starszej wersji gry. Launcher pozwala kopiować światy i otwierać foldery zapisów.
faq.help=Gdzie mogę uzyskać pomoc?
faq.help.answer=Dołącz na Discord lub otwórz zgłoszenie na GitHubie. Podaj wersje launchera i gry oraz kroki odtworzenia problemu. Przed udostępnieniem logów usuń dane osobowe i informacje o koncie.
