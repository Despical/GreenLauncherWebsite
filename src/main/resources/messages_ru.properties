faq.all=Все вопросы и ответы
faq.intro=Установка, аккаунты, моды и миры. Здесь собраны ответы на вопросы о Green Launcher.
faq.memory=Как изменить объём памяти для игры?
faq.memory.answer=Минимальную и максимальную память можно отдельно задать в настройках профиля. Учитывай требования сборки и общий объём памяти; оставляй свободную память для системы.
faq.loaders=Какие загрузчики модов доступны?
faq.loaders.answer=При создании профиля можно выбрать Fabric, Forge или NeoForge. Доступность зависит от версии Minecraft. Выбирай моды для версии игры и загрузчика своего профиля.
faq.modpacks=Смешиваются ли сборки с существующим профилем?
faq.modpacks.answer=Отдельный профиль позволяет хранить сборку независимо от других установок. Используй нужные ей версию Minecraft и загрузчик; не смешивай разные сборки в одной папке игры.
faq.shaders=Можно ли использовать шейдеры и ресурспаки?
faq.shaders.answer=Совместимый контент можно управлять в библиотеке профиля. Для шейдеров нужны Iris или OptiFine подходящей версии. Ресурспаки и шейдеры включаются в соответствующих настройках игры.
faq.import=Можно ли перенести профиль в другую установку?
faq.import.answer=Экспортируй профиль и импортируй его в другую установку. Проверь параметры экспорта и включённые файлы. Войди в аккаунт отдельно и храни резервную копию миров.
faq.logs=Что проверить, если игра не запускается?
faq.logs.answer=Сначала проверь Java, выделенную память и совместимость модов. Посмотри журнал ошибок лаунчера. Для помощи укажи ошибку и шаги воспроизведения, без данных аккаунта.
