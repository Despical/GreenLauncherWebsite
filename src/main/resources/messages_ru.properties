faq.account=Нужен ли аккаунт Microsoft?
faq.account.answer=Можно добавить аккаунт Microsoft; для игры с ним нужна лицензия Minecraft Java Edition. Локальные офлайн-аккаунты также поддерживаются, но могут заходить только на разрешающие их серверы. Лаунчер не выдаёт лицензию Minecraft.
faq.java=Нужно ли отдельно устанавливать Java?
faq.java.answer=Лаунчер может скачать и установить Java для твоей версии Minecraft. В настройках профиля можно выбрать имеющуюся установку. Разным версиям Minecraft может требоваться разная Java; управляй установками в лаунчере.
faq.mods=Можно ли устанавливать моды и сборки?
faq.mods.answer=Да. Просматривай Modrinth в лаунчере и устанавливай моды или сборки в профили. Контент должен подходить к версии Minecraft и загрузчику профиля. Fabric, Forge и NeoForge можно выбрать при создании профиля.
faq.profiles=Можно ли держать версии отдельно?
faq.profiles.answer=Да. У каждого профиля свои версия Minecraft, папка игры, моды, Java и настройки памяти. Обычная игра и сборки не смешиваются. Импортируй и экспортируй профили для повторного использования.
faq.worlds=Можно ли использовать старые миры?
faq.worlds.answer=Импортируй миры на странице миров нужного профиля. Выбирай совместимую версию игры и делай резервную копию перед открытием мира в старой версии. В лаунчере можно копировать миры и открывать папки сохранений.
faq.help=Где получить помощь?
faq.help.answer=Присоединяйся к Discord или создай issue на GitHub. Укажи версии лаунчера и Minecraft и шаги воспроизведения. Перед отправкой логов удали личные данные и сведения об аккаунте.
