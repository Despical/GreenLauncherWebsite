faq.title=Есть вопросы?
faq.free=Green Launcher бесплатный?
faq.free.answer=Да. Green Launcher бесплатный, код открыт под GPL-3.0 и доступен на GitHub. Minecraft приобретается отдельно.
faq.package=Установщик или portable?
faq.package.answer=Для большинства подходит установщик с интеграцией в меню «Пуск». Portable работает без мастера установки; данные остаются в папке данных приложения.
faq.system=Какие системы поддерживаются?
faq.system.answer=Текущие сборки предназначены для 64-битных Windows 10 и 11. Нужную Java можно загрузить через лаунчер. Для первой настройки и загрузок нужен интернет.
faq.update=Как устанавливать обновления?
faq.update.answer=Ты запускаешь обновление после уведомления о новой версии. Во время игр, загрузок и установок обновления заблокированы. Аккаунты, профили и миры хранятся отдельно.
