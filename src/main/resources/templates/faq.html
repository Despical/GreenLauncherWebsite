<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head th:replace="~{fragments :: head(#{nav.faq})}"></head>
    <body class="faq-page">
        <a class="skip-link" href="#main" th:text="#{a11y.skip}"></a>
        <header th:replace="~{fragments :: publicHeader}"></header>
        <main id="main" class="container page-main public-page">
            <div class="page-heading heading-separated">
                <h1 th:text="#{nav.faq}"></h1>
                <p th:text="#{faq.intro}"></p>
            </div>
            <div class="faq-page-layout">
                <aside class="faq-support">
                    <h2 th:text="#{faq.title}"></h2>
                    <p th:text="#{home.faq.copy}"></p>
                    <a class="text-link" href="https://discord.gg/uXVU8jmtpU" target="_blank" rel="noopener noreferrer"
                        ><svg th:replace="~{fragments :: launcherIcon('discord')}"></svg
                        ><span th:text="#{home.faq.help}"></span
                        ><svg th:replace="~{fragments :: icon('external')}"></svg></a
                    ><a class="text-link" href="/features"
                        ><span th:text="#{features.all}"></span><svg th:replace="~{fragments :: icon('arrow')}"></svg
                    ></a>
                </aside>
                <div th:replace="~{fragments :: faqList(${faqQuestions})}"></div>
            </div>
        </main>
        <footer th:replace="~{fragments :: publicFooter}"></footer>
        <div th:replace="~{fragments :: siteControls}"></div>
    </body>
</html>
