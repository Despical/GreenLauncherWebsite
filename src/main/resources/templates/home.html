<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
    <head th:replace="~{fragments :: head(#{nav.home})}"></head>
    <body class="world-home">
        <a class="skip-link" href="#main" th:text="#{a11y.skip}"></a>
        <header th:replace="~{fragments :: publicHeader}"></header>
        <div class="world-journey">
            <div class="world-panorama" aria-hidden="true"><svg th:replace="~{world-panorama :: artwork}"></svg></div>
            <div class="world-lighting" aria-hidden="true"></div>
            <main id="main">
                <section id="surface" class="hero world-chapter world-surface">
                    <div class="container hero-content">
                        <div class="hero-panel">
                            <h1>
                                <span th:text="#{hero.line1}"></span><br /><span
                                    class="muted-heading"
                                    th:text="#{hero.line2}"
                                ></span>
                            </h1>
                            <p class="hero-copy" th:text="#{hero.copy}"></p>
                            <div class="hero-actions">
                                <a class="button button-primary button-large" href="/download"
                                    ><img
                                        class="brand-icon windows-mark"
                                        src="/images/brands/windows.svg"
                                        width="20"
                                        height="20"
                                        alt="" /><span th:text="#{hero.download}"></span></a
                                ><a class="hero-secondary" href="#experience"
                                    ><span th:text="#{hero.explore}"></span
                                    ><svg th:replace="~{fragments :: icon('down')}"></svg
                                ></a>
                            </div>
                            <div class="hero-meta">
                                <span th:text="#{hero.free}"></span><span class="meta-divider"></span
                                ><span th:text="#{hero.platform}"></span>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="experience" class="world-chapter world-cavern">
                    <div class="container chapter-content">
                        <div class="section-intro">
                            <div>
                                <h2>
                                    <span th:text="#{experience.line1}"></span><br /><span
                                        class="muted-heading"
                                        th:text="#{experience.line2}"
                                    ></span>
                                </h2>
                            </div>
                            <p th:text="#{experience.copy}"></p>
                        </div>
                        <div class="feature-showcases home-showcases">
                            <article class="feature-showcase">
                                <div class="feature-showcase-copy">
                                    <h3 th:text="#{home.showcase.home}"></h3>
                                    <p th:text="#{home.showcase.home.copy}"></p>
                                </div>
                                <figure class="features-screen launcher-shot">
                                    <a
                                        class="launcher-shot-link"
                                        href="/images/launcher-home.png"
                                        data-lightbox
                                        th:aria-label="#{home.screenshot.open}"
                                        ><img
                                            src="/images/launcher-home.png"
                                            width="1737"
                                            height="1080"
                                            th:alt="#{home.screenshot.alt}"
                                            loading="lazy"
                                            decoding="async"
                                    /></a>
                                    <figcaption>
                                        <span th:text="#{home.screenshot.caption}"></span><span>v0.19.1</span>
                                    </figcaption>
                                </figure>
                            </article>
                            <article class="feature-showcase">
                                <div class="feature-showcase-copy">
                                    <h3 th:text="#{home.tools.mods}"></h3>
                                    <p th:text="#{home.tools.mods.copy}"></p>
                                </div>
                                <figure class="features-screen">
                                    <a
                                        href="/images/launcher-mods.png"
                                        data-lightbox
                                        th:aria-label="#{home.screenshot.open}"
                                        ><img
                                            src="/images/launcher-mods.png"
                                            width="1380"
                                            height="860"
                                            th:alt="#{features.screen.mods}"
                                            loading="lazy"
                                            decoding="async"
                                    /></a>
                                </figure>
                            </article>
                            <article class="feature-showcase home-profile-showcase">
                                <div class="feature-showcase-copy">
                                    <h3 th:text="#{feature.profiles}"></h3>
                                    <p th:text="#{feature.profiles.copy}"></p>
                                </div>
                                <figure class="features-screen">
                                    <a
                                        href="/images/launcher-profiles.png"
                                        data-lightbox
                                        th:aria-label="#{home.screenshot.open}"
                                        ><img
                                            src="/images/launcher-profiles.png"
                                            width="1380"
                                            height="860"
                                            th:alt="#{features.screen.profiles}"
                                            loading="lazy"
                                            decoding="async"
                                    /></a>
                                </figure>
                                <div class="profile-platforms">
                                    <ul class="platform-list" th:aria-label="#{home.compatibility}">
                                        <li>
                                            <img
                                                class="brand-icon"
                                                src="/images/brands/fabric.png"
                                                width="20"
                                                height="20"
                                                alt=""
                                            />Fabric
                                        </li>
                                        <li>
                                            <img
                                                class="brand-icon"
                                                src="/images/brands/forge.svg"
                                                width="20"
                                                height="20"
                                                alt=""
                                            />Forge
                                        </li>
                                        <li>
                                            <img
                                                class="brand-icon"
                                                src="/images/brands/neoforge.svg"
                                                width="20"
                                                height="20"
                                                alt=""
                                            />NeoForge
                                        </li>
                                        <li>
                                            <img
                                                class="brand-icon"
                                                src="/images/brands/optifine-mark.png"
                                                width="20"
                                                height="20"
                                                alt=""
                                            />OptiFine
                                        </li>
                                        <li>
                                            <img
                                                class="brand-icon"
                                                src="/images/brands/modrinth-logo.svg"
                                                width="20"
                                                height="20"
                                                alt=""
                                            />Modrinth
                                        </li>
                                    </ul>
                                </div>
                            </article>
                        </div>
                        <div class="feature-page-link">
                            <a class="text-link" href="/features"
                                ><span th:text="#{features.all}"></span
                                ><svg th:replace="~{fragments :: icon('arrow')}"></svg
                            ></a>
                        </div>
                    </div>
                </section>
                <div id="stronghold" class="world-chapter world-stronghold">
                    <section class="release-section chapter-content">
                        <div class="container">
                            <div class="section-intro">
                                <div><h2 th:text="#{releases.title}"></h2></div>
                                <a class="text-link" href="/changelog"
                                    ><span th:text="#{releases.all}"></span
                                    ><svg th:replace="~{fragments :: icon('arrow')}"></svg
                                ></a>
                            </div>
                            <div class="release-grid">
                                <a
                                    th:each="release, state : ${releases}"
                                    class="release-card"
                                    th:href="@{/changelog/{v}(v=${release.version()})}"
                                    ><div class="release-card-top">
                                        <span class="version-label" th:text="${'v' + release.version()}"></span
                                        ><span class="badge" th:if="${state.first}" th:text="#{release.latest}"></span>
                                    </div>
                                    <h3 th:text="${release.title()}"></h3>
                                    <p th:text="${release.summary()}"></p>
                                    <div class="release-card-bottom">
                                        <span class="release-card-date" th:text="${release.dateLabel()}"></span
                                        ><span class="text-link"
                                            ><span th:text="#{release.read}"></span
                                            ><svg th:replace="~{fragments :: icon('arrow')}"></svg
                                        ></span></div
                                ></a>
                            </div>
                            <p th:if="${#lists.isEmpty(releases)}" class="empty-state" th:text="#{releases.empty}"></p>
                        </div>
                    </section>
                    <section id="faq" class="container home-faq" aria-labelledby="home-faq-title">
                        <div class="home-faq-intro">
                            <h2 id="home-faq-title" th:text="#{faq.title}"></h2>
                            <p th:text="#{home.faq.copy}"></p>
                            <a
                                class="text-link"
                                href="https://discord.gg/uXVU8jmtpU"
                                target="_blank"
                                rel="noopener noreferrer"
                                ><svg th:replace="~{fragments :: launcherIcon('discord')}"></svg
                                ><span th:text="#{home.faq.help}"></span
                                ><svg th:replace="~{fragments :: icon('external')}"></svg
                            ></a>
                        </div>
                        <div class="home-faq-content">
                            <div th:replace="~{fragments :: faqList(${faqQuestions})}"></div>
                            <a class="text-link faq-more" href="/faq"
                                ><span th:text="#{faq.all}"></span><svg th:replace="~{fragments :: icon('arrow')}"></svg
                            ></a>
                        </div>
                    </section>
                </div>
            </main>
        </div>
        <footer th:replace="~{fragments :: publicFooter}"></footer>
        <div th:replace="~{fragments :: siteControls}"></div>
    </body>
</html>
